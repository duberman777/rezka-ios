name: RezkaPort
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.personal.rezkaport
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    INFOPLIST_KEY_CFBundleDisplayName: Rezka
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    exactVersion: 2.14.1
targets:
  RezkaPort:
    type: application
    platform: iOS
    info:
      path: StreamingApp/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes:
          - audio
    sources:
      - path: StreamingApp
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
  RezkaPortTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StreamingAppTests
    dependencies:
      - target: RezkaPort
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.rezkaport.tests
  RezkaPortUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StreamingAppUITests
    dependencies:
      - target: RezkaPort
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.rezkaport.uitests
        TEST_TARGET_NAME: RezkaPort
schemes:
  RezkaPort:
    build:
      targets:
        RezkaPort: all
    test:
      targets:
        - RezkaPortTests
        - RezkaPortUITests
